<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diligence Brief</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4e0; --accent: #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --panel: #1f2023; --ink: #ececea; --muted: #9b9b95;
      --line: #32333700; --line: #323337; --accent: #6fc3a8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line); }
  input { flex: 1; padding: 11px 13px; background: var(--panel); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 11px 18px; background: var(--accent); color: #fff; border-color: transparent;
           cursor: pointer; font-weight: 550; }
  button:disabled { opacity: .55; cursor: default; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .name { font-weight: 560; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .pick { background: none; color: var(--accent); border: 1px solid var(--line);
          padding: 6px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .brief { font-size: 17px; line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); width: 42%; padding-right: 12px; }
  .stamp { color: var(--muted); font-size: 13px; margin-top: 14px;
           border-top: 1px solid var(--line); padding-top: 12px; }
  .err { color: #b4381f; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Diligence Brief</h1>
  <p class="sub">A company brief written only from India's MCA register — with the record beside it.</p>

  <form id="f">
    <input id="q" placeholder="Company name, e.g. Reliance Industries" autocomplete="off" required>
    <button id="go">Search</button>
  </form>
  <p class="note" id="note"></p>

  <div id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

$('f').onsubmit = async (e) => {
  e.preventDefault()
  const q = $('q').value.trim()
  if (!q) return
  $('go').disabled = true
  $('note').textContent = 'Searching the register…'
  $('out').innerHTML = ''
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q))
    if (!r.ok) throw new Error('Search failed (' + r.status + ')')
    const { candidates, total_matches } = await r.json()
    if (!candidates.length) {
      $('note').textContent = 'No company matches that name.'
      return
    }
    // total_matches, not candidates.length — a free key caps the page at 10.
    $('note').textContent = total_matches + ' companies match. Showing ' +
      candidates.length + '. Pick one for a brief.'
    $('out').innerHTML = '<h2>Candidates</h2>' + candidates.map(c => `
      <div class="card"><div class="row">
        <div>
          <div class="name">${esc(c.company_name)}</div>
          <div class="meta">${esc(c.cin)} · ${esc(c.company_status)} ·
            registered ${esc(c.date_of_registration)} · ${esc(c.registered_state)}</div>
        </div>
        <button class="pick" data-cin="${esc(c.cin)}">Brief</button>
      </div></div>`).join('')
  } catch (err) {
    $('note').innerHTML = '<span class="err">' + esc(err.message) + '</span>'
  } finally {
    $('go').disabled = false
  }
}

$('out').onclick = async (e) => {
  const btn = e.target.closest('.pick')
  if (!btn) return
  btn.disabled = true
  btn.textContent = 'Writing…'
  try {
    const r = await fetch('/api/brief', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: btn.dataset.cin }),
    })
    if (!r.ok) throw new Error((await r.json()).detail || 'Failed')
    const d = await r.json()
    const fields = [
      ['Status', 'company_status'], ['Class', 'company_class'],
      ['Category', 'company_category'], ['Registered', 'date_of_registration'],
      ['Authorised capital', 'authorized_capital'], ['Paid-up capital', 'paidup_capital'],
      ['Registered office', 'registered_office_address'], ['RoC', 'registrar_of_companies'],
      ['NIC code', 'nic_code'], ['Activity', 'industrial_classification'],
    ].filter(([, k]) => d.record[k] !== null && d.record[k] !== '')
    $('out').innerHTML = `
      <h2>Brief</h2>
      <div class="card"><div class="brief">${esc(d.brief)}</div>
        <div class="stamp">Written only from the record below.
          Register current to ${esc(d.knowledge_date)}, captured ${esc(d.capture_date)}.</div>
      </div>
      <h2>The record it was written from</h2>
      <div class="card"><table>${fields.map(([label, k]) =>
        `<tr><td>${esc(label)}</td><td>${esc(d.record[k])}</td></tr>`).join('')}</table></div>`
    window.scrollTo({ top: 0, behavior: 'smooth' })
  } catch (err) {
    btn.disabled = false
    btn.textContent = 'Brief'
    $('note').innerHTML = '<span class="err">' + esc(err.message) + '</span>'
  }
}
</script>
</body>
</html>
